<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odd or Even — Hand Cricket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100dvh;
    font-family: 'Anton', sans-serif;
    background:
        radial-gradient(circle, rgba(23,19,16,.07) 1.6px, transparent 1.6px) 0 0 / 22px 22px,
        #f2ead6;
    color: #171310;
    align-items: flex-start;
    padding: 12px 0;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
}

.game {
    width: min(860px, calc(100vw - 24px));
    min-height: min(600px, calc(100dvh - 24px));
    background: #fffaf0;
    border: 4px solid #171310;
    border-radius: 26px;
    padding: 20px;
    box-shadow: 10px 10px 0 #171310;
    position: relative;
    overflow: hidden;
}

h1 {
    text-align: center;
    margin: 0;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 58px;
    letter-spacing: 1px;
    color: #171310;
}

.subtitle {
    text-align: center;
    color: #e6394f;
    margin: 2px 0 25px;
    font-size: 18px;
    letter-spacing: .5px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

#tossScreen.active,
#choiceScreen.active {
    min-height: clamp(360px, calc(100dvh - 190px), 500px);
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    border: 3px solid #171310;
    font-family: 'Anton', sans-serif;
    border-radius: 12px;
    padding: 14px 25px;
    font-size: 17px;
    font-weight: 400;
    cursor: pointer;
    transition: .15s;
    box-shadow: 5px 5px 0 #171310;
}

button:hover {
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0 #171310;
}

button:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 #171310;
}

.primary {
    background: #ffcb2f;
    color: #171310;
}

.dark {
    background: #fffaf0;
    color: #171310;
}

/* TOSS */

.toss-box {
    text-align: center;
    margin-top: 0;
    position: relative;
    top: -45px;
}

.coin {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    border: 4px solid #171310;
    border-radius: 50%;
    color: #171310;
    font-family: 'Anton', sans-serif;
    font-size: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #ffcb2f;
    box-shadow: 5px 5px 0 #171310;
    transform-style: preserve-3d;
}

.coin.tossing {
    animation: coinToss 1.4s ease-in-out;
}

@keyframes coinToss {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(2160deg); }
}

.toss-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.toss-box h2,
.choice-box h2 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 32px;
    letter-spacing: .3px;
}

.toss-box p {
    font-size: 16px;
    color: #6b6156;
}

.toss-buttons button {
    padding: 16px 29px;
}

.toss-buttons button:disabled {
    cursor: wait;
    opacity: .55;
    transform: none;
}

/* CHOICE */

.choice-box {
    text-align: center;
    margin-top: 0;
    position: relative;
    top: -45px;
}

.choice-coin {
    margin-bottom: 18px;
}

.choice-buttons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 30px;
}

.choice-buttons button {
    width: 160px;
    font-size: 19px;
}

/* MATCH */

.match-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.badge {
    background: #fffaf0;
    border: 3px solid #171310;
    color: #171310;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 14px;
    box-shadow: 3px 3px 0 #171310;
}

.super-badge {
    background: #e6394f;
    border-color: #171310;
    color: #fffaf0;
    animation: superGlow 1.4s ease-in-out infinite;
}

@keyframes superGlow {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
}

.scoreboard {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin: 20px 0;
}

.score {
    text-align: center;
    position: relative;
    min-width: 110px;
}

.score-name {
    color: #6b6156;
    font-size: 14px;
    letter-spacing: .3px;
}

.score-number {
    width: 94px;
    height: 70px;
    margin: 8px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fffaf0;
    border: 3px solid #171310;
    border-radius: 16px;
    font-family: 'Anton', sans-serif;
    font-size: 40px;
    box-shadow: 4px 4px 0 #171310;
}

.score-gain {
    position: absolute;
    top: 54px;
    left: 50%;
    color: #3fae52;
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 8px);
}

.score:first-child .score-gain {
    left: -24px;
}

.score:last-child .score-gain {
    left: calc(100% + 24px);
}

.score-gain.show {
    animation: scoreGain .9s ease-out forwards;
}

@keyframes scoreGain {
    0% {
        opacity: 0;
        transform: translate(-50%, 18px) scale(.8);
    }
    20% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1.08);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -55px) scale(1);
    }
}

/* TARGET */

.target {
    text-align: center;
    color: #6b6156;
    min-height: 24px;
    font-size: 16px;
}

.target strong {
    color: #e6394f;
}

/* COMMENTARY */

.commentary {
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 25px;
    letter-spacing: .2px;
    min-height: 30px;
    margin: 12px 0;
}

/* PRESSURE */

.pressure-wrap {
    width: 70%;
    margin: 10px auto 25px;
}

.pressure-label {
    display: flex;
    justify-content: space-between;
    color: #6b6156;
    font-size: 13px;
    margin-bottom: 5px;
}

.pressure {
    height: 10px;
    background: #fffaf0;
    border: 2px solid #171310;
    border-radius: 20px;
    overflow: hidden;
}

.pressure-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3fae52, #ffcb2f, #e6394f);
    transition: .3s;
}

/* BATTLE */

.battle-zone {
    position: relative;
    height: 250px;
    margin-top: 10px;
}

.battle {
    position: relative;
    height: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8%;
}

.card {
    width: 210px;
    height: 180px;
    background: #fffaf0;
    color: #171310;
    border: 3px solid #171310;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
    box-shadow: 7px 7px 0 #171310;
}

.card-name {
    font-size: 15px;
    color: #6b6156;
}

.card-number {
    font-family: 'Anton', sans-serif;
    font-size: 82px;
    line-height: 1;
    margin-top: 6px;
}

.card.green {
    background: #3fae52;
    color: #fffaf0;
}

.card.red {
    background: #e6394f;
    color: #fffaf0;
}

.card.green .card-name,
.card.red .card-name {
    color: rgba(255,250,240,.85);
}

/*
    IMPORTANT:
    The winner gets z-index BEFORE the animation begins.
    Therefore it physically passes in front.
*/

.battle.slide .you-card {
    animation: youMove 0.5s ease-in-out forwards;
}

.battle.slide .cpu-card {
    animation: cpuMove 0.5s ease-in-out forwards;
}

.battle.return .you-card {
    animation: youReturn 0.5s ease-in-out forwards;
}

.battle.return .cpu-card {
    animation: cpuReturn 0.5s ease-in-out forwards;
}

.yfront .you-card {
    z-index: 10;
}

.cfront .cpu-card {
    z-index: 10;
}

@keyframes youMove {
    from { transform: translateX(0); }
    to { transform: translateX(170px); }
}

@keyframes cpuMove {
    from { transform: translateX(0); }
    to { transform: translateX(-170px); }
}

@keyframes youReturn {
    from { transform: translateX(170px); }
    to { transform: translateX(0); }
}

@keyframes cpuReturn {
    from { transform: translateX(-170px); }
    to { transform: translateX(0); }
}

/* BALLS */

.ball-area {
    text-align: center;
    margin-top: 10px;
}

.timer {
    width: 60%;
    margin: 0 auto 15px;
    height: 10px;
    background: #fffaf0;
    border: 2px solid #171310;
    border-radius: 20px;
    overflow: hidden;
}

.timer-bar {
    width: 100%;
    height: 100%;
    background: #e6394f;
}

.number-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.number-buttons button {
    width: 64px;
    height: 64px;
    padding: 0;
    border-radius: 30%;
    background: #fffaf0;
    color: #171310;
    border: 3px solid #171310;
    font-family: 'Anton', sans-serif;
    font-size: 26px;
    position: relative;
    overflow: hidden;
    box-shadow: 4px 4px 0 #171310;
}

.number-buttons button::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1.5px dashed rgba(230,57,79,.5);
    border-radius: 30%;
    pointer-events: none;
}

.number-buttons button:hover {
    background: #ffcb2f;
    color: #171310;
    border-color: #171310;
}

/* SUPER OVER */

.super-over-title {
    text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 34px;
    letter-spacing: .3px;
    color: #e6394f;
    margin-bottom: 5px;
}

.balls-left {
    text-align: center;
    font-size: 15px;
    color: #6b6156;
}

.balls-left strong {
    color: #171310;
    font-family: 'Anton', sans-serif;
    font-size: 22px;
}

/* RESULT */

.result-box {
    text-align: center;
    margin-top: 100px;
    position: relative;
    z-index: 2;
}

.fireworks {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.fireworks.show {
    display: block;
}

.firework {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffcb2f;
    box-shadow:
        0 -48px #ffcb2f,
        34px -34px #e6394f,
        48px 0 #3fae52,
        34px 34px #171310,
        0 48px #ffcb2f,
        -34px 34px #e6394f,
        -48px 0 #3fae52,
        -34px -34px #171310;
    animation: fireworkBurst 1.8s ease-out infinite;
}

.firework:nth-child(1) {
    top: 30%;
    left: 20%;
}

.firework:nth-child(2) {
    top: 30%;
    left: 80%;
    animation-delay: .6s;
}

.firework:nth-child(3) {
    top: 88%;
    left: 50%;
    animation-delay: 1.1s;
}

@keyframes fireworkBurst {
    0% {
        opacity: 0;
        transform: scale(.15);
    }
    18% {
        opacity: 1;
    }
    75% {
        opacity: .9;
        transform: scale(1);
    }
    100% {
        opacity: 0;
        transform: scale(1.35);
    }
}

.result-title {
    font-family: 'Anton', sans-serif;
    font-size: 58px;
    letter-spacing: .3px;
    margin-bottom: 15px;
    color: #171310;
}

.final-score {
    font-size: 20px;
    color: #6b6156;
    margin-bottom: 30px;
}

@media(max-width:700px) {

    .game {
        padding: 20px;
    }

    .card {
        width: 145px;
        height: 150px;
    }

    .card-number {
        font-size: 60px;
    }

    @keyframes youMove {
        from { transform: translateX(0); }
        to { transform: translateX(80px); }
    }

    @keyframes cpuMove {
        from { transform: translateX(0); }
        to { transform: translateX(-80px); }
    }

    @keyframes youReturn {
        from { transform: translateX(80px); }
        to { transform: translateX(0); }
    }

    @keyframes cpuReturn {
        from { transform: translateX(-80px); }
        to { transform: translateX(0); }
    }
}

@media(max-height:820px) {

    .game {
        min-height: min(560px, calc(100dvh - 16px));
        padding: 12px;
    }

    h1 {
        font-size: 38px;
    }

    .subtitle {
        margin: 2px 0 8px;
    }

    .toss-box {
        margin-top: 30px;
    }

    .choice-box {
        margin-top: 40px;
    }

    .scoreboard {
        margin: 6px 0;
    }

    .pressure-wrap {
        margin: 4px auto 8px;
    }

    .battle-zone {
        height: 160px;
    }

    .card {
        width: min(180px, 34vw);
        height: 125px;
    }

    .card-number {
        font-size: 54px;
    }

    .ball-area {
        margin-top: 4px;
    }

    .timer {
        margin-bottom: 8px;
    }

    .number-buttons button {
        width: 54px;
        height: 54px;
        font-size: 22px;
    }

}

/* =========================
   CROWD STICKMEN
========================= */

.crowd {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 190px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    padding: 30px 4px;
    pointer-events: none;
    z-index: 1;
}

.crowd-left {
    left: 4px;
}

.crowd-right {
    right: 4px;
}

.crowd-left > .stickman:not(.foreground-stickman):not(.middle-stickman) {
    left: -38px;
}

.crowd-right > .stickman:not(.foreground-stickman):not(.middle-stickman) {
    right: -38px;
}

@media (max-width: 820px) {
    .crowd {
        display: none;
    }
}

.stickman {
    position: relative;
    width: 125px;
    height: 120px;
    flex: 0 0 80px;
    animation: idleSway var(--idle-dur, 3.4s) var(--idle-delay, 0s) ease-in-out infinite;
    transform-origin: 50% 100%;
}

.stickman.has-sign {
    margin-top: 22px;
}

.foreground-stickman {
    position: absolute;
    z-index: 2;
}

.middle-stickman {
    position: absolute;
    z-index: 1;
}

.base-stickman {
    position: absolute;
    z-index: 0;
}

.fig-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    display: block;
}

.fig-svg .head {
    fill: #fffaf0;
    stroke: #171310;
    stroke-width: 4;
}

.fig-svg .eye {
    fill: #171310;
}

.fig-svg .mouth-happy {
    fill: none;
    stroke: #171310;
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 1;
    transition: opacity .2s;
}

.fig-svg .mouth-sad {
    fill: none;
    stroke: #171310;
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity .2s;
}

.stickman.sad-mode .mouth-happy {
    opacity: 0;
}

.stickman.sad-mode .mouth-sad {
    opacity: 1;
}

.fig-svg .mouth-shock {
    fill: #171310;
    opacity: 0;
    transition: opacity .15s;
}

.stickman.excited-mode .mouth-happy {
    opacity: 0;
}

.stickman.excited-mode .mouth-shock {
    opacity: 1;
}

.fig-svg .jersey {
    stroke: #171310;
    stroke-width: 3;
    stroke-linejoin: round;
}

.fig-svg .cap {
    stroke: #171310;
    stroke-width: 3;
    stroke-linejoin: round;
}

.fig-svg .cap-brim {
    stroke: #171310;
    stroke-width: 3.5;
    stroke-linecap: round;
}

.fig-svg .torso,
.fig-svg .arm,
.fig-svg .leg {
    stroke: #171310;
    stroke-width: 4.5;
    stroke-linecap: round;
}

.fig-svg .thumb {
    fill: #fffaf0;
    stroke: #171310;
    stroke-width: 3;
}

.sign-board {
    position: absolute;
    top: 34%;
    left: 50%;
    transform: translate(-50%, 0) rotate(-4deg);
    width: 72px;
    background: #fffaf0;
    border: 2.5px solid #171310;
    border-radius: 6px;
    padding: 4px 5px;
    font-size: 9.5px;
    line-height: 1.15;
    text-align: center;
    white-space: pre-line;
    box-shadow: 2px 2px 0 #171310;
    z-index: 2;
    color: #171310;
}

@keyframes idleSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
}

/* FOUR — happy hops */
@keyframes fourHop {
    0% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-26px) rotate(-8deg) scale(1.08); }
    55% { transform: translateY(-6px) rotate(7deg); }
    78% { transform: translateY(-16px) rotate(-5deg); }
    100% { transform: translateY(0) rotate(0); }
}

@keyframes fourClap {
    0% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-14px) rotate(7deg) scale(1.1); }
    50% { transform: translateY(-4px) rotate(-7deg); }
    75% { transform: translateY(-12px) rotate(5deg); }
    100% { transform: translateY(0) rotate(0); }
}

/* SIX — go wild */
@keyframes sixJump {
    0% { transform: translateY(0) rotate(0) scale(1); }
    25% { transform: translateY(-48px) rotate(-12deg) scale(1.2); }
    50% { transform: translateY(-10px) rotate(10deg) scale(1.06); }
    72% { transform: translateY(-30px) rotate(-8deg) scale(1.14); }
    100% { transform: translateY(0) rotate(0) scale(1); }
}

@keyframes sixFlip {
    0% { transform: translateY(0) rotate(0) scale(1); }
    40% { transform: translateY(-54px) rotate(-200deg) scale(1.16); }
    70% { transform: translateY(-18px) rotate(-340deg) scale(1.05); }
    100% { transform: translateY(0) rotate(-360deg) scale(1); }
}

@keyframes sixWave {
    0% { transform: translateY(0) rotate(-6deg); }
    20% { transform: translateY(-40px) rotate(13deg) scale(1.16); }
    45% { transform: translateY(-8px) rotate(-13deg); }
    68% { transform: translateY(-26px) rotate(11deg) scale(1.1); }
    100% { transform: translateY(0) rotate(-6deg); }
}

/* CLAP — nice running */
@keyframes clapHop {
    0% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-14px) rotate(-6deg) scale(1.05); }
    55% { transform: translateY(-4px) rotate(5deg); }
    78% { transform: translateY(-9px) rotate(-4deg); }
    100% { transform: translateY(0) rotate(0); }
}

@keyframes clapClap {
    0% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-8px) rotate(6deg) scale(1.06); }
    50% { transform: translateY(-2px) rotate(-6deg); }
    75% { transform: translateY(-7px) rotate(4deg); }
    100% { transform: translateY(0) rotate(0); }
}

/* CHEER — good shot */
@keyframes cheerJump {
    0% { transform: translateY(0) rotate(0) scale(1); }
    28% { transform: translateY(-34px) rotate(-10deg) scale(1.14); }
    55% { transform: translateY(-8px) rotate(8deg); }
    78% { transform: translateY(-20px) rotate(-6deg); }
    100% { transform: translateY(0) rotate(0) scale(1); }
}

@keyframes cheerWave {
    0% { transform: translateY(0) rotate(-5deg); }
    22% { transform: translateY(-28px) rotate(11deg) scale(1.1); }
    48% { transform: translateY(-6px) rotate(-11deg); }
    70% { transform: translateY(-18px) rotate(9deg); }
    100% { transform: translateY(0) rotate(-5deg); }
}

/* WICKET — celebrate */
@keyframes wktLeap {
    0% { transform: translateY(0) rotate(0); }
    28% { transform: translateY(-42px) rotate(12deg) scale(1.14); }
    55% { transform: translateY(-8px) rotate(-10deg); }
    80% { transform: translateY(-20px) rotate(8deg); }
    100% { transform: translateY(0) rotate(0); }
}

@keyframes wktSpin {
    0% { transform: translateY(0) rotate(0) scale(1); }
    45% { transform: translateY(-46px) rotate(200deg) scale(1.14); }
    75% { transform: translateY(-14px) rotate(330deg); }
    100% { transform: translateY(0) rotate(360deg) scale(1); }
}

/* GROAN — despair */
@keyframes groanDip {
    0% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(12px) rotate(-6deg) scale(.94); }
    60% { transform: translateY(6px) rotate(5deg); }
    100% { transform: translateY(0) rotate(0); }
}

@keyframes groanShake {
    0%, 100% { transform: translateY(6px) rotate(0) scale(.95); }
    20% { transform: translateY(8px) rotate(-9deg) scale(.93); }
    40% { transform: translateY(8px) rotate(9deg) scale(.93); }
    60% { transform: translateY(8px) rotate(-6deg); }
    80% { transform: translateY(8px) rotate(6deg); }
}

@keyframes winJump {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    40% { transform: translateY(-30px) rotate(6deg) scale(1.08); }
    60% { transform: translateY(-14px) rotate(-4deg); }
}

@keyframes loseSlump {
    0% { transform: translateY(0) rotate(0); }
    60% { transform: translateY(12px) rotate(7deg) scale(.95); }
    100% { transform: translateY(10px) rotate(6deg) scale(.96); }
}

.stickman.four-1 { animation: fourHop .82s var(--rx-delay, 0s) cubic-bezier(.34, 1.56, .64, 1) both; }
.stickman.four-2 { animation: fourClap .82s var(--rx-delay, 0s) ease both; }
.stickman.six-1 { animation: sixJump .95s var(--rx-delay, 0s) cubic-bezier(.34, 1.56, .64, 1) both; }
.stickman.six-2 { animation: sixFlip 1s var(--rx-delay, 0s) cubic-bezier(.5, 0, .5, 1) both; }
.stickman.six-3 { animation: sixWave .95s var(--rx-delay, 0s) ease both; }
.stickman.clap-1 { animation: clapHop .78s var(--rx-delay, 0s) cubic-bezier(.34, 1.56, .64, 1) both; }
.stickman.clap-2 { animation: clapClap .78s var(--rx-delay, 0s) ease both; }
.stickman.cheer-1 { animation: cheerJump .88s var(--rx-delay, 0s) cubic-bezier(.34, 1.56, .64, 1) both; }
.stickman.cheer-2 { animation: cheerWave .88s var(--rx-delay, 0s) ease both; }
.stickman.wkt-1 { animation: wktLeap .9s var(--rx-delay, 0s) cubic-bezier(.34, 1.56, .64, 1) both; }
.stickman.wkt-2 { animation: wktSpin 1s var(--rx-delay, 0s) cubic-bezier(.5, 0, .5, 1) both; }
.stickman.grn-1 { animation: groanDip .8s var(--rx-delay, 0s) ease both; }
.stickman.grn-2 { animation: groanShake .8s var(--rx-delay, 0s) ease both; }

.stickman.win-mode { animation: winJump .9s var(--idle-delay, 0s) ease-in-out infinite; }
.stickman.lose-mode { animation: loseSlump 1.2s ease forwards; }

/* CROWD SPEECH BUBBLES */
.crowd-bubble {
    position: absolute;
    top: -16px;
    left: 50%;
    background: #fffaf0;
    border: 3px solid #171310;
    border-radius: 12px;
    padding: 3px 9px;
    font-family: 'Anton', sans-serif;
    font-size: 13px;
    letter-spacing: .3px;
    white-space: nowrap;
    color: #171310;
    box-shadow: 3px 3px 0 #171310;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-50%);
    animation: bubblePop 1.05s cubic-bezier(.34, 1.56, .64, 1) forwards;
}

.crowd-bubble.red { background: #e6394f; color: #fffaf0; }
.crowd-bubble.green { background: #3fae52; color: #fffaf0; }
.crowd-bubble.yellow { background: #ffcb2f; color: #171310; }

.crowd-bubble::after {
    content: '';
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 9px 6px 0;
    border-style: solid;
    border-color: #171310 transparent transparent;
}

@keyframes bubblePop {
    0% { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.3) rotate(-8deg); }
    25% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.12) rotate(4deg); }
    70% { opacity: 1; transform: translateX(-50%) translateY(-3px) scale(1) rotate(-1deg); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(.95); }
}

/* =========================
   COMIC BURST
========================= */

.comic-burst {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 80;
}

.comic-burst .burst-shape {
    opacity: 0;
    transform: scale(.2) rotate(-14deg);
    font-family: 'Anton', sans-serif;
    padding: 20px 28px;
    border: 4px solid #171310;
    text-align: center;
    letter-spacing: .5px;
    border-radius: 10px;
}

.comic-burst.show .burst-shape {
    animation: burstPop .9s cubic-bezier(.34, 1.56, .64, 1) forwards;
}

@keyframes burstPop {
    0% { opacity: 0; transform: scale(.2) rotate(-16deg); }
    35% { opacity: 1; transform: scale(1.2) rotate(6deg); }
    55% { transform: scale(.92) rotate(-4deg); }
    75% { transform: scale(1.08) rotate(2deg); }
    100% { opacity: 0; transform: scale(1.05) rotate(0); }
}

.burst-shape.burst-four {
    background: #ffcb2f;
    color: #171310;
    font-size: 34px;
    box-shadow: 8px 8px 0 #171310;
}

.burst-shape.burst-six {
    background: #e6394f;
    color: #fffaf0;
    font-size: 42px;
    box-shadow: 10px 10px 0 #171310;
}

.burst-shape.burst-five {
    background: #f2994a;
    color: #171310;
    font-size: 38px;
    box-shadow: 9px 9px 0 #171310;
}

.burst-shape.burst-wicket {
    background: #171310;
    color: #ffcb2f;
    font-size: 30px;
    box-shadow: 8px 8px 0 #e6394f;
}

.burst-shape.burst-oof {
    background: #d8d0bd;
    color: #171310;
    font-size: 24px;
    box-shadow: 6px 6px 0 #171310;
}

.burst-shape.burst-win {
    background: #3fae52;
    color: #fffaf0;
    font-size: 42px;
    box-shadow: 10px 10px 0 #171310;
}

.burst-shape.burst-lose {
    background: #6b6156;
    color: #fffaf0;
    font-size: 30px;
    box-shadow: 8px 8px 0 #171310;
}

/* =========================
   CONFETTI
========================= */

.confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
}

.confetti-piece {
    position: absolute;
    top: -20px;
    width: 9px;
    height: 15px;
    opacity: .95;
    border-radius: 2px;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
}

@keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(var(--rot, 360deg)); opacity: 0; }
}

@media (max-width: 700px) {
    .sign-board {
        font-size: 8.5px;
        width: 62px;
    }
}
</style>

<body>

<div id="crowdRight" class="crowd crowd-right" aria-hidden="true"></div>

<script>

/* =========================
   GAME STATE
========================= */

let tossChoice = null;
let tossWinner = null;

let firstBatter = null;
let batter = null;

let innings = 1;

let youScore = 0;
let cpuScore = 0;

let target = null;

let timerInterval = null;
let turnLocked = false;
let tossInProgress = false;


/* =========================
   CROWD STICKMEN — SETUP
========================= */

const stickmanPoses = {

    cheer: `<line class="arm" x1="50" y1="46" x2="22" y2="16"/><line class="arm" x1="50" y1="46" x2="78" y2="16"/>`,

    wave: `<line class="arm" x1="50" y1="46" x2="34" y2="66"/><line class="arm" x1="50" y1="46" x2="84" y2="14"/>`,

    sign: `<line class="arm" x1="50" y1="46" x2="34" y2="62"/><line class="arm" x1="50" y1="46" x2="66" y2="62"/>`,

    thumbs: `<line class="arm" x1="50" y1="46" x2="28" y2="64"/><line class="arm" x1="50" y1="46" x2="70" y2="32"/><circle class="thumb" cx="74" cy="25" r="5"/>`,

    jump: `<line class="arm" x1="50" y1="46" x2="16" y2="20"/><line class="arm" x1="50" y1="46" x2="84" y2="20"/>`

};


function stickmanSVG(pose, jersey) {

    const legs =
        pose === 'jump'
        ? `<line class="leg" x1="50" y1="88" x2="40" y2="118"/><line class="leg" x1="50" y1="88" x2="60" y2="118"/>`
        : `<line class="leg" x1="50" y1="88" x2="30" y2="128"/><line class="leg" x1="50" y1="88" x2="70" y2="128"/>`;

    return `<svg class="fig-svg" viewBox="0 0 100 140">
        <path class="jersey" fill="${jersey}" d="M37,50 Q50,46 63,50 L67,86 Q50,92 33,86 Z"/>
        <line class="torso" x1="50" y1="44" x2="50" y2="88"/>
        ${stickmanPoses[pose] || stickmanPoses.cheer}
        ${legs}
        <circle class="head" cx="50" cy="24" r="18"/>
        <path class="cap" fill="${jersey}" d="M32,19 Q50,2 68,19 Q50,12 32,19 Z"/>
        <line class="cap-brim" x1="64" y1="18" x2="80" y2="15"/>
        <circle class="eye" cx="43" cy="22" r="2.6"/>
        <circle class="eye" cx="57" cy="22" r="2.6"/>
        <path class="mouth-happy" d="M42,29 Q50,39 58,29"/>
        <path class="mouth-sad" d="M42,36 Q50,27 58,36"/>
        <ellipse class="mouth-shock" cx="50" cy="33" rx="5" ry="6"/>
    </svg>`;

}


function buildStickman(pose, signText) {

    const wrap = document.createElement('div');

    wrap.className = 'stickman' + (signText ? ' has-sign' : '');
    wrap.style.setProperty('--idle-delay', (Math.random() * 2).toFixed(2) + 's');
    wrap.style.setProperty('--idle-dur', (2.8 + Math.random() * 1.2).toFixed(2) + 's');

    const jerseyColors = ['#e6394f', '#3fae52', '#ffcb2f', '#171310'];
    const jersey = jerseyColors[Math.floor(Math.random() * jerseyColors.length)];

    wrap.innerHTML = stickmanSVG(pose, jersey);

    if (signText) {

        const sign = document.createElement('div');

        sign.className = 'sign-board';
        sign.innerText = signText;

        wrap.appendChild(sign);

    }

    return wrap;

}


function populateCrowd() {

    const leftConfig = [
        ['cheer', "GO USER\nGO!"],
        ['sign', "LET'S WIN\nTHIS!"],
        ['wave', "GO USER\nGO!"],
        ['jump', null],
        ['jump', null],
        ['thumbs', null],
        ['wave', null],
        ['jump', null],
        ['jump', null],
        ['thumbs', null],
        ['wave', null],
        ['jump', null]
    ];

    const rightConfig = [
        ['sign', "GO USER\nGO!"],
        ['cheer', null],
        ['thumbs', "GO USER\nGO!"],
        ['wave', null],
        ['sign', "YOU GOT\nTHIS!"],
        ['jump', null],
        ['cheer', null],
        ['thumbs', null],
        ['wave', null],
        ['jump', null],
        ['cheer', null],
        ['thumbs', null]
    ];

    const uniformTop = index => ((index + 1) / (leftConfig.length + 1)) * 100;
    const upperLayerTop = index => uniformTop(index) - 7;

    const leftEl = document.getElementById('crowdLeft');
    const rightEl = document.getElementById('crowdRight');

    leftConfig.forEach(([pose, text], index) => {

        if (index % 2 === 0) {
            const figure = buildStickman(pose, text);
            figure.classList.add('base-stickman');
            figure.style.top = upperLayerTop(index) + '%';
            leftEl.appendChild(figure);
        }

    });

    rightConfig.forEach(([pose, text], index) => {

        if (index % 2 === 0) {
            const figure = buildStickman(pose, text);
            figure.classList.add('base-stickman');
            figure.style.top = upperLayerTop(index) + '%';
            rightEl.appendChild(figure);
        }

    });

    leftConfig.forEach(([pose, text], index) => {
        if (index % 2 === 0) {
            const figure = buildStickman(pose, text);
            figure.classList.add('foreground-stickman');
            figure.style.top = upperLayerTop(index) + '%';
            figure.style.left = '212px';
            leftEl.appendChild(figure);
        }
    });

    rightConfig.forEach(([pose, text], index) => {
        if (index % 2 === 0) {
            const figure = buildStickman(pose, text);
            figure.classList.add('foreground-stickman');
            figure.style.top = upperLayerTop(index) + '%';
            figure.style.right = '212px';
            rightEl.appendChild(figure);
        }
    });

    leftConfig.forEach(([pose], index) => {
        if (index % 2 === 1) {
            const figure = buildStickman(pose, null);
            figure.classList.add('middle-stickman');
            figure.style.top = upperLayerTop(index) + '%';
            figure.style.left = '87px';
            leftEl.appendChild(figure);
        }
    });

    rightConfig.forEach(([pose], index) => {
        if (index % 2 === 1) {
            const figure = buildStickman(pose, null);
            figure.classList.add('middle-stickman');
            figure.style.top = upperLayerTop(index) + '%';
            figure.style.right = '87px';
            rightEl.appendChild(figure);
        }
    });

}

populateCrowd();


/* =========================
   CROWD REACTIONS
========================= */

const REACTION_VARIANTS = {
    'react-four': ['four-1', 'four-2'],
    'react-six': ['six-1', 'six-2', 'six-3'],
    'react-wicket': ['wkt-1', 'wkt-2'],
    'react-groan': ['grn-1', 'grn-2'],
    'react-clap': ['clap-1', 'clap-2'],
    'react-cheer': ['cheer-1', 'cheer-2']
};

const ALL_REACTION_CLASSES = [
    'four-1', 'four-2',
    'six-1', 'six-2', 'six-3',
    'wkt-1', 'wkt-2',
    'grn-1', 'grn-2',
    'clap-1', 'clap-2',
    'cheer-1', 'cheer-2',
    'excited-mode', 'sad-mode'
];

const REACTION_BUBBLES = {
    'react-four': { words: ['FOUR!', 'SHOT!', 'GREAT!', '🚀'], color: 'yellow' },
    'react-six': { words: ['SIX!', 'BOOM!', 'MAXIMUM!', '💥', 'WOOO!'], color: 'red' },
    'react-wicket': { words: ['HOWZAT!', 'OUT!', 'GOTCHA!', 'YESSS!', '🔥'], color: 'green' },
    'react-groan': { words: ['OHHH', 'NOOO', 'AWW', '😩', '😱'], color: '' },
    'react-clap': { words: ['NICE!', 'GOOD RUN!', 'CLAP CLAP', '👏'], color: 'yellow' },
    'react-cheer': { words: ['C\'MON!', 'LOVELY!', 'YEAHHH!', '🙌'], color: 'green' }
};


function crowdReact(cls, duration) {

    const stickmen = document.querySelectorAll('.stickman');
    const variants = REACTION_VARIANTS[cls] || ['four-1'];
    const excited = cls !== 'react-groan';

    stickmen.forEach(el => {

        el.classList.remove(...ALL_REACTION_CLASSES);
        el.style.removeProperty('--rx-delay');

    });

    void document.body.offsetWidth;

    stickmen.forEach(el => {

        /* Each fan picks their own random reaction and a small delay,
           so the crowd erupts as a lively wave instead of in lockstep. */

        const variant = variants[Math.floor(Math.random() * variants.length)];

        el.style.setProperty('--rx-delay', (Math.random() * 0.2).toFixed(2) + 's');
        el.classList.add(variant, excited ? 'excited-mode' : 'sad-mode');

    });

    const bubble = REACTION_BUBBLES[cls];

    if (bubble) {

        showCrowdBubbles(bubble.words, bubble.color);

    }

    setTimeout(() => {

        stickmen.forEach(el => {

            el.classList.remove(...ALL_REACTION_CLASSES);
            el.style.removeProperty('--rx-delay');

        });

    }, duration + 250);

}


function showCrowdBubbles(words, colorClass) {

    document.querySelectorAll('.stickman').forEach(el => {

        /* Only about half the crowd shouts something, for a natural feel. */

        if (Math.random() > 0.5) return;

        const bubble = document.createElement('div');

        bubble.className = 'crowd-bubble' + (colorClass ? ' ' + colorClass : '');
        bubble.textContent = words[Math.floor(Math.random() * words.length)];
        bubble.style.animationDelay = (Math.random() * 0.15).toFixed(2) + 's';

        el.appendChild(bubble);

        setTimeout(() => bubble.remove(), 1250);

    });

}


function showComicBurst(text, type, duration = 900) {

    const burst = document.getElementById('comicBurst');

    burst.innerHTML = `<div class="burst-shape burst-${type}">${text}</div>`;
    burst.classList.remove('show');

    void burst.offsetWidth;

    burst.classList.add('show');

    setTimeout(() => {

        burst.classList.remove('show');
        burst.innerHTML = '';

    }, duration);

}


function crowdWinMode(on) {

    document.querySelectorAll('.stickman').forEach(el => {

        el.classList.toggle('win-mode', on);
        el.classList.toggle('excited-mode', on);

        if (!on) {

            el.classList.remove('sad-mode');

        }

    });

}


function crowdLoseMode(on) {

    document.querySelectorAll('.stickman').forEach(el => {

        el.classList.toggle('lose-mode', on);
        el.classList.toggle('sad-mode', on);

    });

}


function spawnConfetti(count = 60) {

    const layer = document.getElementById('confettiLayer');

    layer.innerHTML = '';

    const colors = ['#ffcb2f', '#e6394f', '#3fae52', '#171310', '#fffaf0'];

    for (let i = 0; i < count; i++) {

        const piece = document.createElement('div');

        piece.className = 'confetti-piece';
        piece.style.left = (Math.random() * 100) + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (2.4 + Math.random() * 2) + 's';
        piece.style.animationDelay = (Math.random() * 0.7) + 's';
        piece.style.setProperty('--rot', (Math.random() * 360) + 'deg');

        layer.appendChild(piece);

    }

    setTimeout(() => {

        layer.innerHTML = '';

    }, 5200);

}


/* SUPER OVER STATE */

let superOver = false;

let superOverNumber = 0;

let superBall = 0;

let superYouScore = 0;
let superCpuScore = 0;

let superFirstBatter = null;
let superBatter = null;


/* =========================
   RANDOM
========================= */

function randomNumber() {

    return Math.floor(Math.random() * 6) + 1;

}


/* =========================
   SCREEN
========================= */

function showScreen(id) {

    document.querySelectorAll('.screen')
        .forEach(screen => screen.classList.remove('active'));

    document.getElementById(id)
        .classList.add('active');

}


/* =========================
   TOSS
========================= */

function animateCoinToss(onComplete) {

    if (tossInProgress) return;

    tossInProgress = true;

    const coin = document.querySelector('.coin');
    const buttons = document.querySelectorAll('#tossScreen .toss-buttons button');

    buttons.forEach(button => button.disabled = true);
    coin.classList.remove('tossing');
    void coin.offsetWidth;
    coin.classList.add('tossing');

    setTimeout(() => {

        coin.classList.remove('tossing');

        setTimeout(() => {

            buttons.forEach(button => button.disabled = false);
            tossInProgress = false;
            onComplete();

        }, 300);

    }, 1400);

}

function toss(choice) {

    tossChoice = choice;

    const result =
        Math.random() < 0.5
        ? 'Heads'
        : 'Tails';

    animateCoinToss(() => {

        if (choice === result) {

            tossWinner = 'you';

            document.getElementById('tossScreen')
                .querySelector('.toss-buttons').style.display = 'flex';

            document.getElementById('tossMessage').innerText =
                `🪙 ${result}! You won the toss!`;

            document.getElementById('choiceInstruction').innerText =
                'You choose: BAT or BOWL';

            showScreen('choiceScreen');

        } else {

            tossWinner = 'cpu';

            document.getElementById('tossMessage').innerText =
                `🪙 ${result}! Computer won the toss!`;

            const computerChoice =
                Math.random() < 0.5
                ? 'bat'
                : 'bowl';

            firstBatter =
                computerChoice === 'bat'
                ? 'cpu'
                : 'you';

            batter = firstBatter;

            document.getElementById('tossScreen')
                .querySelector('h2').innerText =
                `🪙 ${result}! Computer won the toss!`;

            document.getElementById('tossScreen')
                .querySelector('p').innerText =
                `Computer chose to ${computerChoice.toUpperCase()}!`;

            document.getElementById('tossScreen')
                .querySelector('.toss-buttons').style.display = 'none';

            document.getElementById('choiceScreen')
                .classList.remove('active');

            showScreen('tossScreen');

            setTimeout(() => {

                startNormalMatch();

            }, 1500);

            return;

        }

    });

}


/* =========================
   ROLE CHOICE
========================= */

function chooseRole(role) {

    if (tossWinner !== 'you') {

        return;

    }

    if (role === 'bat') {

        firstBatter = 'you';

    } else {

        firstBatter = 'cpu';

    }

    batter = firstBatter;

    startNormalMatch();

}


/* =========================
   START NORMAL MATCH
========================= */

function startNormalMatch() {

    innings = 1;

    youScore = 0;
    cpuScore = 0;

    target = null;

    superOver = false;

    document.getElementById('superBadge').style.display = 'none';
    document.getElementById('superTitle').style.display = 'none';
    document.getElementById('ballsLeft').style.display = 'none';

    updateScores();

    document.getElementById('inningsBadge').innerText =
        '1ST INNINGS';

    if (batter === 'you') {

        setCommentary('🏏 You are batting first!');

    } else {

        setCommentary('🤖 Computer is batting first!');

    }

    showScreen('matchScreen');

    startTurn();

}


/* =========================
   START TURN
========================= */

function startTurn() {

    turnLocked = false;

    resetCards();

    startTimer();

}


/* =========================
   TIMER
========================= */

function startTimer() {

    clearInterval(timerInterval);

    const duration = 4000;

    const start = performance.now();

    timerInterval = setInterval(() => {

        const elapsed = performance.now() - start;

        const remaining =
            Math.max(0, 1 - elapsed / duration);

        document.getElementById('timerBar')
            .style.width = `${remaining * 100}%`;

        if (remaining <= 0) {

            clearInterval(timerInterval);

            if (!turnLocked) {

                /*
                    If player doesn't choose,
                    automatically select a number.
                */

                play(randomNumber(), true);

            }

        }

    }, 30);

}


/* =========================
   PLAY BALL
========================= */

function play(playerNumber, automatic = false) {

    if (turnLocked) return;

    turnLocked = true;

    clearInterval(timerInterval);

    document.getElementById('timerBar')
        .style.width = '0%';


    const computerNumber = randomNumber();


    document.getElementById('youNumber')
        .innerText = playerNumber;

    document.getElementById('cpuNumber')
        .innerText = computerNumber;


    if (superOver) {

        playSuperOverBall(
            playerNumber,
            computerNumber
        );

        return;

    }

    /* =========================
       NORMAL MATCH — YOU BATTING
    ========================= */

    if (batter === 'you') {

        if (playerNumber === computerNumber) {

            /*
                COMPUTER WINS THE BATTLE.
                Put computer IN FRONT BEFORE animation.
            */

            document.getElementById('youCard')
                .className = 'card you-card';

            document.getElementById('cpuCard')
                .className = 'card cpu-card red';

            animateBattle('cfront');

            setCommentary('🔴 OUT! Computer got your wicket!');

            crowdReact('react-groan', 700);
            showComicBurst('OUT...', 'oof', 700);


            setTimeout(() => {

                if (innings === 1) {

                    startSecondInnings();

                } else {

                    finishNormalMatch('cpu');

                }

            }, 1500);


        } else {

            /*
                YOU SCORE.
                Put YOU IN FRONT before animation.
            */

            document.getElementById('youCard')
                .className = 'card you-card green';

            document.getElementById('cpuCard')
                .className = 'card cpu-card';

            animateBattle('yfront');

            youScore += playerNumber;

            showScoreGain('you', playerNumber);

            setCommentary(
                getBattingComment(playerNumber)
            );

            updateScores();

            if (playerNumber === 6) {

                crowdReact('react-six', 1000);
                showComicBurst('SIX!! 💥', 'six', 1000);

            } else if (playerNumber === 4) {

                crowdReact('react-four', 850);
                showComicBurst('FOUR! 🚀', 'four', 850);

            } else if (playerNumber === 5) {

                crowdReact('react-cheer', 900);
                showComicBurst('5!! 🙌', 'five', 900);

            } else if (playerNumber === 1 || playerNumber === 2) {

                crowdReact('react-clap', 700);

            }

            setTimeout(() => {

                /*
                    Only the SECOND innings can finish
                    by passing the target.
                */

                if (innings === 2 && youScore > target) {

                    finishNormalMatch('you');

                } else {

                    returnBattle();

                }

            }, 1000);

        }

    }


    /* =========================
       NORMAL MATCH — CPU BATTING
    ========================= */

    else {

        if (playerNumber === computerNumber) {

            /*
                YOU BOWLED THE COMPUTER.
            */

            document.getElementById('youCard')
                .className = 'card you-card';

            document.getElementById('cpuCard')
                .className = 'card cpu-card red';

            animateBattle('yfront');

            setCommentary('🔥 WICKET! You got the computer!');

            crowdReact('react-wicket', 850);
            showComicBurst('WICKET!! 🔥', 'wicket', 850);


            setTimeout(() => {

                if (innings === 1) {

                    startSecondInnings();

                } else {

                    finishNormalMatch('you');

                }

            }, 1500);


        } else {

            /*
                COMPUTER SCORES.
            */

            document.getElementById('youCard')
                .className = 'card you-card';

            document.getElementById('cpuCard')
                .className = 'card cpu-card';

            animateBattle('cfront');

            cpuScore += computerNumber;

            showScoreGain('cpu', computerNumber);

            setCommentary(
                getComputerComment(computerNumber)
            );

            updateScores();

            if (computerNumber === 6) {

                crowdReact('react-groan', 600);

            }


            setTimeout(() => {

                /*
                    CRITICAL:
                    Computer cannot win in first innings.

                    The score only becomes a target.
                */

                if (innings === 2 && cpuScore > target) {

                    finishNormalMatch('cpu');

                } else {

                    returnBattle();

                }

            }, 1000);

        }

    }

}


/* =========================
   SECOND INNINGS
========================= */

function startSecondInnings() {

    innings = 2;

    target =
        firstBatter === 'you'
        ? youScore
        : cpuScore;

    batter =
        firstBatter === 'you'
        ? 'cpu'
        : 'you';


    document.getElementById('inningsBadge')
        .innerText = '2ND INNINGS';

    document.getElementById('target')
        .innerHTML =
        `🎯 Target: <strong>${target + 1}</strong>`;

    if (batter === 'you') {

        setCommentary(
            `🔥 Your chase begins! Need ${target + 1} runs!`
        );

    } else {

        setCommentary(
            `🔥 Computer needs ${target + 1} runs!`
        );

    }


    resetCards();

    setTimeout(() => {

        startTurn();

    }, 1000);

}


/* =========================
   NORMAL MATCH FINISH
========================= */

function finishNormalMatch(winner) {

    /*
        If scores are tied after innings,
        GO TO SUPER OVER.
    */

    if (youScore === cpuScore) {

        setCommentary('⚠️ MATCH TIED!');

        setTimeout(() => {

            startSuperOver();

        }, 1500);

        return;

    }


    finishGame(winner);

}


/* =========================
   SUPER OVER
========================= */

function startSuperOver() {

    superOver = true;

    superOverNumber++;

    superBall = 0;

    superYouScore = 0;
    superCpuScore = 0;

    /*
        Fresh toss.
    */

    tossChoice = null;
    tossWinner = null;

    document.getElementById('superBadge')
        .style.display = 'block';

    document.getElementById('superTitle')
        .style.display = 'block';

    document.getElementById('ballsLeft')
        .style.display = 'block';

    document.getElementById('inningsBadge')
        .innerText =
        `SUPER OVER #${superOverNumber}`;


    document.getElementById('target')
        .innerHTML = '🪙 Fresh toss for the Super Over!';


    /*
        Instead of going to normal toss screen,
        create a dedicated Super Over toss.
    */

    showSuperToss();

}


/* =========================
   SUPER TOSS
========================= */

function showSuperToss() {

    document.getElementById('tossScreen')
        .querySelector('.toss-buttons').style.display = 'flex';

    document.getElementById('tossScreen')
        .querySelector('h2').innerText =
        `🔥 SUPER OVER #${superOverNumber} — TOSS`;

    document.getElementById('tossScreen')
        .querySelector('p').innerText =
        'Choose Heads or Tails';

    showScreen('tossScreen');

}


/* =========================
   SUPER TOSS OVERRIDE
========================= */

const originalToss = toss;

toss = function(choice) {

    /*
        If this is a normal match,
        use the normal toss.
    */

    if (!superOver) {

        originalToss(choice);

        return;

    }


    const result =
        Math.random() < 0.5
        ? 'Heads'
        : 'Tails';


    animateCoinToss(() => {

        if (choice === result) {

            tossWinner = 'you';

            document.getElementById('tossScreen')
                .querySelector('.toss-buttons').style.display = 'flex';

            document.getElementById('tossMessage').innerText =
                `🪙 ${result}! You won the Super Over toss!`;

            document.getElementById('choiceInstruction').innerText =
                'Choose BAT or BOWL';

            showScreen('choiceScreen');

        } else {

            tossWinner = 'cpu';

            document.getElementById('tossMessage').innerText =
                `🪙 ${result}! Computer won the Super Over toss!`;

            const computerChoice =
                Math.random() < 0.5
                ? 'bat'
                : 'bowl';

            superFirstBatter =
                computerChoice === 'bat'
                ? 'cpu'
                : 'you';

            superBatter = superFirstBatter;
            superBall = 0;

            updateSuperOverUI();

            document.getElementById('tossScreen')
                .querySelector('h2').innerText =
                `🪙 ${result}! Computer won the Super Over toss!`;

            document.getElementById('tossScreen')
                .querySelector('p').innerText =
                `Computer chose to ${computerChoice.toUpperCase()}!`;

            document.getElementById('tossScreen')
                .querySelector('.toss-buttons').style.display = 'none';

            showScreen('tossScreen');

            setTimeout(() => {

                showScreen('matchScreen');

                setCommentary(
                    superBatter === 'you'
                    ? '🏏 You bat first in the Super Over!'
                    : '🤖 Computer bats first in the Super Over!'
                );

                startTurn();

            }, 1500);

            return;

        }

    });

};


/* =========================
   SUPER OVER ROLE
========================= */

const originalChooseRole = chooseRole;

chooseRole = function(role) {

    if (!superOver) {

        originalChooseRole(role);

        return;

    }


    if (tossWinner === 'you') {

        superFirstBatter =
            role === 'bat'
            ? 'you'
            : 'cpu';

    } else {

        superFirstBatter =
            role === 'bat'
            ? 'cpu'
            : 'you';

    }


    superBatter = superFirstBatter;

    superBall = 0;

    updateSuperOverUI();

    showScreen('matchScreen');

    setCommentary(
        superBatter === 'you'
        ? '🏏 You bat first in the Super Over!'
        : '🤖 Computer bats first in the Super Over!'
    );

    startTurn();

};


/* =========================
   SUPER OVER BALL
========================= */

function playSuperOverBall(playerNumber, computerNumber) {

    superBall++;

    updateSuperOverUI();


    /*
        YOU BATTING
    */

    if (superBatter === 'you') {

        if (playerNumber === computerNumber) {

            document.getElementById('youCard')
                .className = 'card you-card';

            document.getElementById('cpuCard')
                .className = 'card cpu-card red';

            animateBattle('cfront');

            setCommentary('🔴 OUT!');

            crowdReact('react-groan', 700);
            showComicBurst('OUT...', 'oof', 700);

            setTimeout(() => {

                endSuperInnings();

            }, 1500);

        } else {

            superYouScore += playerNumber;

            showScoreGain('you', playerNumber);

            document.getElementById('youCard')
                .className = 'card you-card green';

            document.getElementById('cpuCard')
                .className = 'card cpu-card';

            animateBattle('yfront');

            setCommentary(
                `🔥 ${playerNumber} RUN${playerNumber > 1 ? 'S' : ''}!`
            );

            if (playerNumber === 6) {

                crowdReact('react-six', 1000);
                showComicBurst('SIX!! 💥', 'six', 1000);

            } else if (playerNumber === 4) {

                crowdReact('react-four', 850);
                showComicBurst('FOUR! 🚀', 'four', 850);

            } else if (playerNumber === 5) {

                crowdReact('react-cheer', 900);
                showComicBurst('5!! 🙌', 'five', 900);

            } else if (playerNumber === 1 || playerNumber === 2) {

                crowdReact('react-clap', 700);

            }

            updateSuperOverUI();

            setTimeout(() => {

                if (
                    superBatter !== superFirstBatter &&
                    superYouScore > superCpuScore
                ) {

                    finishGame('you');

                } else if (superBall >= 6) {

                    endSuperInnings();

                } else {

                    returnBattle();

                }

            }, 1000);

        }

    }


    /*
        CPU BATTING
    */

    else {

        if (playerNumber === computerNumber) {

            superCpuScore += 0;

            document.getElementById('youCard')
                .className = 'card you-card';

            document.getElementById('cpuCard')
                .className = 'card cpu-card red';

            animateBattle('yfront');

            setCommentary('🔥 WICKET!');

            crowdReact('react-wicket', 850);
            showComicBurst('WICKET!! 🔥', 'wicket', 850);

            setTimeout(() => {

                endSuperInnings();

            }, 1500);

        } else {

            superCpuScore += computerNumber;

            showScoreGain('cpu', computerNumber);

            document.getElementById('youCard')
                .className = 'card you-card';

            document.getElementById('cpuCard')
                .className = 'card cpu-card';

            animateBattle('cfront');

            setCommentary(
                `🤖 Computer scores ${computerNumber}!`
            );

            updateSuperOverUI();

            setTimeout(() => {

                if (
                    superBatter !== superFirstBatter &&
                    superCpuScore > superYouScore
                ) {

                    finishGame('cpu');

                } else if (superBall >= 6) {

                    endSuperInnings();

                } else {

                    returnBattle();

                }

            }, 1000);

        }

    }

}


/* =========================
   END SUPER INNINGS
========================= */

function endSuperInnings() {

    /*
        First Super Over innings finished.
    */

    if (superBatter === superFirstBatter) {

        superBatter =
            superFirstBatter === 'you'
            ? 'cpu'
            : 'you';

        superBall = 0;

        let firstScore =
            superFirstBatter === 'you'
            ? superYouScore
            : superCpuScore;

        document.getElementById('target')
            .innerHTML =
            `🎯 Super Over target: <strong>${firstScore + 1}</strong>`;

        setCommentary(
            superBatter === 'you'
            ? `🔥 You need ${firstScore + 1} to win!`
            : `🔥 Computer needs ${firstScore + 1} to win!`
        );

        updateSuperOverUI();

        resetCards();

        setTimeout(() => {

            startTurn();

        }, 1200);

        return;

    }


    /*
        SECOND SUPER OVER INNINGS FINISHED.
    */

    if (superYouScore === superCpuScore) {

        setCommentary(
            '😱 SUPER OVER TIED! ANOTHER ONE!'
        );

        setTimeout(() => {

            startSuperOver();

        }, 1800);

        return;

    }


    if (superYouScore > superCpuScore) {

        finishGame('you');

    } else {

        finishGame('cpu');

    }

}


/* =========================
   SUPER UI
========================= */

function updateSuperOverUI() {

    document.getElementById('youScore')
        .innerText = superYouScore;

    document.getElementById('cpuScore')
        .innerText = superCpuScore;

    document.getElementById('ballsNumber')
        .innerText =
        Math.max(0, 6 - superBall);

    document.getElementById('ballsLeft')
        .style.display = 'block';


    /*
        Pressure increases as balls disappear
        and target gets closer.
    */

    let pressure =
        Math.min(100, (superBall / 6) * 100);

    document.getElementById('pressureBar')
        .style.width = `${pressure}%`;

    document.getElementById('pressureText')
        .innerText = `${Math.round(pressure)}%`;

}


/* =========================
   ANIMATION
========================= */

function animateBattle(front) {

    const battle =
        document.getElementById('battle');

    battle.className =
        `battle slide ${front}`;

}


/* =========================
   RETURN CARDS
========================= */

function returnBattle() {

    const battle =
        document.getElementById('battle');

    battle.className =
        'battle return';

    void battle.offsetWidth;

    setTimeout(() => {

        resetCards();

        startTurn();

    }, 500);

}


/* =========================
   RESET CARDS
========================= */

function resetCards() {

    const battle =
        document.getElementById('battle');

    battle.className = 'battle';


    document.getElementById('youCard')
        .className = 'card you-card';

    document.getElementById('cpuCard')
        .className = 'card cpu-card';

    document.getElementById('youNumber')
        .innerText = '?';

    document.getElementById('cpuNumber')
        .innerText = '?';

}


/* =========================
   SCORES
========================= */

function showScoreGain(player, runs) {

    const gain = document.getElementById(
        player === 'you'
        ? 'youGain'
        : 'cpuGain'
    );

    gain.innerText = `+${runs}`;
    gain.classList.remove('show');
    void gain.offsetWidth;
    gain.classList.add('show');

    setTimeout(() => {

        gain.classList.remove('show');

    }, 900);

}

/* =========================
   CROWD MOOD (chase pressure)
========================= */

/*
    As the computer chases the target, the crowd's
    baseline expression eases from a smile toward a
    frown the closer the pressure bar climbs — this
    is separate from the short-lived burst reactions
    (four/six/wicket/etc.), which still play on top.
*/

let crowdMoodT = 0;

function setCrowdMouthShape(t) {

    const cornerY = 29 + (36 - 29) * t;
    const midY = 39 + (27 - 39) * t;

    const d =
        `M42,${cornerY.toFixed(2)} Q50,${midY.toFixed(2)} 58,${cornerY.toFixed(2)}`;

    document.querySelectorAll('.stickman .mouth-happy').forEach(el => {

        el.setAttribute('d', d);

    });

}

function updateCrowdMood(pressure, active) {

    const targetT =
        active
        ? Math.min(1, Math.max(0, pressure / 100))
        : 0;

    const startT = crowdMoodT;
    const duration = 600;
    const startTime = performance.now();

    function step(now) {

        const progress = Math.min(1, (now - startTime) / duration);

        crowdMoodT = startT + (targetT - startT) * progress;

        setCrowdMouthShape(crowdMoodT);

        if (progress < 1) {

            requestAnimationFrame(step);

        }

    }

    requestAnimationFrame(step);

}


function updateScores() {

    document.getElementById('youScore')
        .innerText = youScore;

    document.getElementById('cpuScore')
        .innerText = cpuScore;


    let pressure = 0;

    if (innings === 2 && target !== null) {

        const current =
            batter === 'you'
            ? youScore
            : cpuScore;

        pressure =
            Math.min(
                100,
                Math.max(
                    0,
                    ((current / (target + 1)) * 100)
                )
            );

    }

    document.getElementById('pressureBar')
        .style.width = `${pressure}%`;

    document.getElementById('pressureText')
        .innerText = `${Math.round(pressure)}%`;

    updateCrowdMood(
        pressure,
        innings === 2 && target !== null && batter === 'cpu'
    );

}


/* =========================
   COMMENTARY
========================= */

function setCommentary(text) {

    document.getElementById('commentary')
        .innerText = text;

}


function getBattingComment(n) {

    const comments = {

        1: '🏃 Single!',
        2: '🏃🏃 Two runs!',
        3: '🔥 Three runs!',
        4: '🚀 FOUR!',
        5: '🔥 FIVE!',
        6: '💥 SIX!!!'

    };

    return comments[n];

}


function getComputerComment(n) {

    const comments = {

        1: '🤖 Computer takes 1',
        2: '🤖 Two runs!',
        3: '🤖 Three runs!',
        4: '🤖 FOUR!',
        5: '🤖 FIVE!',
        6: '🤖 SIX!!!'

    };

    return comments[n];

}


/* =========================
   FINISH GAME
========================= */

function finishGame(winner) {

    clearInterval(timerInterval);

    const fireworks = document.getElementById('fireworks');

    fireworks.classList.toggle('show', winner === 'you');

    showScreen('resultScreen');


    if (winner === 'you') {

        document.getElementById('resultTitle')
            .innerText = '🏆 YOU WIN!';

        crowdWinMode(true);
        crowdLoseMode(false);
        spawnConfetti(70);
        showComicBurst('WE WON!! 🏆', 'win', 1500);
        showCrowdBubbles(['WE WON!', 'CHAMPIONS!', '🏆', 'YESSS!'], 'green');

    } else {

        document.getElementById('resultTitle')
            .innerText = '🤖 COMPUTER WINS!';

        crowdLoseMode(true);
        crowdWinMode(false);
        showComicBurst('GAME OVER', 'lose', 1500);
        showCrowdBubbles(['AWW', 'NEXT TIME', '😢'], '');

    }


    if (superOver) {

        document.getElementById('finalScore')
            .innerText =
            `Super Over #${superOverNumber} — You ${superYouScore} : ${superCpuScore} Computer`;

    } else {

        document.getElementById('finalScore')
            .innerText =
            `Final Score — You ${youScore} : ${cpuScore} Computer`;

    }

}


/* =========================
   RESTART
========================= */

function restart() {

    clearInterval(timerInterval);

    document.getElementById('fireworks')
        .classList.remove('show');

    crowdWinMode(false);
    crowdLoseMode(false);

    crowdMoodT = 0;
    setCrowdMouthShape(0);

    document.getElementById('confettiLayer').innerHTML = '';

    const burstEl = document.getElementById('comicBurst');
    burstEl.classList.remove('show');
    burstEl.innerHTML = '';

    tossChoice = null;
    tossWinner = null;

    firstBatter = null;
    batter = null;

    innings = 1;

    youScore = 0;
    cpuScore = 0;

    target = null;

    superOver = false;
    superOverNumber = 0;

    superBall = 0;

    superYouScore = 0;
    superCpuScore = 0;

    superFirstBatter = null;
    superBatter = null;

    document.getElementById('superBadge')
        .style.display = 'none';

    document.getElementById('superTitle')
        .style.display = 'none';

    document.getElementById('ballsLeft')
        .style.display = 'none';

    document.getElementById('target')
        .innerHTML = '';

    document.getElementById('tossScreen')
        .querySelector('h2').innerText =
        "It's Toss Time!";

    document.getElementById('tossScreen')
        .querySelector('p').innerText =
        'Choose Heads or Tails';

    document.getElementById('tossScreen')
        .querySelector('.toss-buttons').style.display = 'flex';

    resetCards();

    showScreen('tossScreen');

}


document.addEventListener('keydown', event => {

    if (
        event.repeat ||
        !document.getElementById('matchScreen').classList.contains('active') ||
        !/^[1-6]$/.test(event.key)
    ) {

        return;

    }

    play(Number(event.key));

});

</script>
